name: Custom Build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: false
        default: "Sweeneynt"
      app_version:
        description: "App version"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase config
        run: |
          test -f android/app/google-services.json || { echo "Missing android/app/google-services.json (download it from Firebase console)"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Patch app name and version
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          APP_VERSION: ${{ github.event.inputs.app_version }}
        run: |
          export VERSION_CODE="$(date +%s)"
          python3 - <<'PY'
          import os, re

          name = os.environ.get("APP_NAME") or "Sweeneynt"
          version = os.environ.get("APP_VERSION") or "1.0.0"
          code = os.environ["VERSION_CODE"]

          esc = (name.replace("&", "&amp;").replace("<", "&lt;")
                     .replace(">", "&gt;").replace('"', "&quot;"))

          manifest = "android/app/src/main/AndroidManifest.xml"
          with open(manifest, encoding="utf-8") as f:
              m = f.read()

          def fix_app_tag(match):
              tag = match.group(0)
              if re.search(r'android:label="[^"]*"', tag):
                  return re.sub(r'android:label="[^"]*"', lambda _: 'android:label="' + esc + '"', tag, count=1)
              return tag[:-1] + ' android:label="' + esc + '">'

          m = re.sub(r'<application\b[^>]*>', fix_app_tag, m, count=1)
          with open(manifest, "w", encoding="utf-8") as f:
              f.write(m)

          gradle = "android/app/build.gradle"
          with open(gradle, encoding="utf-8") as f:
              g = f.read()
          safe_version = version.replace("\\", "\\\\").replace("'", "\\'")
          g = re.sub(r"versionName\s+['\"][^'\"]*['\"]", lambda _: "versionName '" + safe_version + "'", g, count=1)
          g = re.sub(r"versionCode\s+\d+", lambda _: "versionCode " + code, g, count=1)
          with open(gradle, "w", encoding="utf-8") as f:
              f.write(g)

          print("Patched: name=%s version=%s code=%s" % (name, version, code))
          PY

      - name: Apply custom icon if provided
        run: |
          if [ -f build-icon.png ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android/app/src/main/res/mipmap-$d"
              cp build-icon.png "android/app/src/main/res/mipmap-$d/ic_launcher.png"
              cp build-icon.png "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            done
            python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, encoding="utf-8") as f:
              m = f.read()
          def add_icons(match):
              tag = match.group(0)
              if "android:icon" in tag:
                  return tag
              return tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          m = re.sub(r'<application\b[^>]*>', add_icons, m, count=1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(m)
          PY
            echo "Custom icon applied."
          else
            echo "build-icon.png not found, keeping default icon."
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sweeneynt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error